<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0A0A1A"/>
      <stop offset="100%" stop-color="#111128"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="8" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="512" height="512" rx="96" fill="url(#bg)"/>
  <!-- Torii Gate -->
  <g filter="url(#glow)" stroke="#FF6B9D" stroke-width="8" fill="none" stroke-linecap="round">
    <!-- Pillars -->
    <line x1="160" y1="180" x2="160" y2="400"/>
    <line x1="352" y1="180" x2="352" y2="400"/>
    <!-- Top beam (kasagi) - curved -->
    <path d="M 120 160 Q 256 130 392 160"/>
    <!-- Second beam (nuki) -->
    <line x1="140" y1="190" x2="372" y2="190"/>
    <!-- Cross beam -->
    <line x1="170" y1="250" x2="342" y2="250"/>
  </g>
  <!-- Kanji 工 -->
  <text x="256" y="345" text-anchor="middle" font-family="serif" font-size="72" font-weight="900" fill="#FF6B9D" opacity="0.3">工</text>
</svg>
